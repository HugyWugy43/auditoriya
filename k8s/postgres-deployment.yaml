apiVersion: v1
kind: ConfigMap
metadata:
  name: database-init
data:
  01-databases.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      -v user_password="$USER_DB_PASSWORD" -v room_password="$ROOM_DB_PASSWORD" \
      -v booking_password="$BOOKING_DB_PASSWORD" -v notification_password="$NOTIFICATION_DB_PASSWORD" <<'SQL'
    SELECT format('CREATE ROLE audit_users LOGIN PASSWORD %L', :'user_password') \gexec
    SELECT format('CREATE ROLE audit_rooms LOGIN PASSWORD %L', :'room_password') \gexec
    SELECT format('CREATE ROLE audit_bookings LOGIN PASSWORD %L', :'booking_password') \gexec
    SELECT format('CREATE ROLE audit_notifications LOGIN PASSWORD %L', :'notification_password') \gexec
    CREATE DATABASE audit_users OWNER audit_users;
    CREATE DATABASE audit_rooms OWNER audit_rooms;
    CREATE DATABASE audit_bookings OWNER audit_bookings;
    CREATE DATABASE audit_notifications OWNER audit_notifications;
    REVOKE CONNECT ON DATABASE audit_users, audit_rooms, audit_bookings, audit_notifications FROM PUBLIC;
    GRANT CONNECT ON DATABASE audit_users TO audit_users;
    GRANT CONNECT ON DATABASE audit_rooms TO audit_rooms;
    GRANT CONNECT ON DATABASE audit_bookings TO audit_bookings;
    GRANT CONNECT ON DATABASE audit_notifications TO audit_notifications;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-isolated-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
      - name: postgres
        image: postgres:17
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audit-secrets
              key: POSTGRES_PASSWORD
        - name: USER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audit-secrets
              key: USER_DB_PASSWORD
        - name: ROOM_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audit-secrets
              key: ROOM_DB_PASSWORD
        - name: BOOKING_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audit-secrets
              key: BOOKING_DB_PASSWORD
        - name: NOTIFICATION_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audit-secrets
              key: NOTIFICATION_DB_PASSWORD
        - name: TZ
          value: "Europe/Moscow"
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: [pg_isready, -U, postgres]
          initialDelaySeconds: 5
        volumeMounts:
        - {name: storage, mountPath: /var/lib/postgresql/data}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
      - name: storage
        persistentVolumeClaim: {claimName: postgres-isolated-pvc}
      - name: init
        configMap: {name: database-init}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
  - {port: 5432, targetPort: 5432}
  type: ClusterIP
