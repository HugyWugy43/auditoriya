apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
      - name: api-gateway
        image: audit/api-gateway:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_ADDRESS
          value: "0.0.0.0"
        - name: JAVA_TOOL_OPTIONS
          value: "-Duser.timezone=Europe/Moscow"
        - name: USER_SERVICE_URL
          value: "http://user-service:8081"
        - name: ROOM_SERVICE_URL
          value: "http://room-service:8082"
        - name: BOOKING_SERVICE_URL
          value: "http://booking-service:8083"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:8084"
        readinessProbe:
          httpGet: {path: /actuator/health, port: 8080}
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests: {memory: 256Mi, cpu: 100m}
          limits: {memory: 768Mi, cpu: "1"}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: {app: api-gateway}
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
