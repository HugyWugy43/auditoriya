server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: api-gateway
  http:
    codecs:
      max-in-memory-size: 256KB
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/auth/**
            - id: room
              uri: ${ROOM_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/rooms/**
            - id: booking
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/bookings/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**,/api/subscriptions/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
services:
  user: ${USER_SERVICE_URL:http://localhost:8081}
  room: ${ROOM_SERVICE_URL:http://localhost:8082}
  booking: ${BOOKING_SERVICE_URL:http://localhost:8083}
